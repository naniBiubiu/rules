name: Update rules, convert, and publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    paths:
      - list_rules.txt
      - json_rules.txt
      - list2singbox.py
      - .github/workflows/update.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Ensure directories exist
        run: |
          mkdir -p list json srs

      - name: Clean list/, json/, srs/
        shell: bash
        run: |
          set -euo pipefail
          for d in list json srs; do
            mkdir -p "$d"
            find "$d" -mindepth 1 -exec rm -rf {} +
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install sing-box
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/apt/keyrings
          sudo curl -fsSL https://sing-box.app/gpg.key -o /etc/apt/keyrings/sagernet.asc
          sudo chmod a+r /etc/apt/keyrings/sagernet.asc
          echo '
          Types: deb
          URIs: https://deb.sagernet.org/
          Suites: *
          Components: *
          Enabled: yes
          Signed-By: /etc/apt/keyrings/sagernet.asc
          ' | sudo tee /etc/apt/sources.list.d/sagernet.sources
          sudo apt-get update
          sudo apt-get install -y sing-box
          sing-box version

      - name: Download .list files from list_rules.txt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s list_rules.txt ]]; then
            while IFS= read -r url || [[ -n "$url" ]]; do
              [[ -z "${url// }" || "${url}" =~ ^[[:space:]]*# ]] && continue
              clean="${url%%\?*}"
              base="$(basename "$clean")"
              [[ "$base" != *.list ]] && base="${base}.list"
              echo "Fetching: $url -> list/$base"
              curl -fsSL "$url" -o "list/$base"
            done < list_rules.txt
          else
            echo "list_rules.txt missing or empty; skipping .list downloads."
          fi

      # ===== Replaces the old "Build sing-rules-converter from source" +
      #       "Convert .list -> .json/.srs" steps. That third-party Go tool
      #       is capped at rule-set version 3 (its own docs say
      #       "-v, --version uint8  Rule set version (1-3) (default 3)").
      #       list2singbox.py writes version 5 directly, and the actual
      #       .srs is produced later by the official `sing-box rule-set
      #       compile`, same as the json_rules.txt path below. =====
      - name: Convert .list -> .json (version 5) with list2singbox.py
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in list/*.list; do
            echo "Converting $f"
            python3 list2singbox.py "$f" -o "json/$(basename "${f%.list}.json")"
          done

      - name: Download .json files from json_rules.txt
        shell: bash
        run: |
          set -euo pipefail
          rules="json_rules.txt"
          if [[ -s "$rules" ]]; then
            echo "Using rules file: $rules"
            while IFS= read -r url || [[ -n "$url" ]]; do
              [[ -z "${url// }" || "${url}" =~ ^[[:space:]]*# ]] && continue
              clean="${url%%\?*}"
              base="$(basename "$clean")"
              [[ "$base" != *.json ]] && base="${base}.json"
              echo "Fetching: $url -> json/$base"
              curl -fsSL "$url" -o "json/$base"
            done < "$rules"
          else
            echo "json_rules.txt missing or empty; skipping JSON downloads."
          fi

      - name: Compile json/*.json -> srs/*.srs with sing-box
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in json/*.json; do
            base="$(basename "${f%.json}")"
            out="srs/${base}.srs"
            echo "Compiling $f -> $out"
            sing-box rule-set compile --output "$out" "$f"
          done

      - name: Commit & push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add list json srs || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: clean, update rules, and regenerate"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref }}
